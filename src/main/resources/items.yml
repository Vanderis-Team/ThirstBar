#########################
# You can use either a positive number or a positive percentage
# to define how much thirst an item restores.
#
# Examples:
# 20   = restores 20 thirst points
# 20%  = restores 20% of the maximum thirst
#
# Negative values are also supported if you want an item to reduce thirst.
#
# Examples:
# -67  = reduces thirst by 67 points
# -99% = reduces 99% of the maximum thirst
#########################

# Configure vanilla Minecraft items that affect thirst here.
# Format: "MATERIAL_NAME:restore_value"
vanilla-items:
  - "APPLE:20"
  - "POTATO:20%"
  - "ROTTEN_FLESH:-10"
  - "POTION:30"
  - "GOLDEN_APPLE:50"
  - "MILK_BUCKET:75%"

# Configure custom items that affect thirst here.
# If you do not want to use this feature, set custom-items to [].
custom-items:
  'canteen':
    material: WOODEN_SWORD
    hide-attribute: true
    # Use custom-model-data to apply a custom texture to this item.
    # Remove this line if you do not need custom model data.
    custom-model-data: 1023
    events:
      right_click:
        type: on_water
        replace: dirty_water_canteen
      crafting:
        type: crafting
        variable:
          A: LEATHER
          B: STRING
          C: CHARCOAL
          X: NONE
        recipe:
          - "X | A | B"
          - "A | C | A"
          - "X | A | X"
    # Hex color codes in the format &#RRGGBB are supported
    # in both the display name and lore.
    display_name: "&6Canteen"
    lore:
      - '&7An empty canteen.'
  'dirty_water_canteen':
    material: WOODEN_SWORD
    drinking-model:
      material: POTION
      custom-model-data: 1023
    hide-attribute: true
    show-durability: true # Show durability bar when the item have been used/consume
    # Use custom-model-data to apply a custom texture to this item.
    # Remove this line if you do not need custom model data.
    custom-model-data: 1023
    events:
      right_click:
        type: on_water
        replace: dirty_water_canteen
      consume:
        type: on_player
        max-usage: 5
        restore: 5 #restore thirst per consume
        water-type: RAW_WATER
        replace: canteen
      cook:
        type: cooking
        exp: 10.0
        cooking-time: 200
        replace: clean_water_canteen
    usage-bar:
      font: "customcrops:default" # default is minecraft:default
      left: '뀂'   # Left cap of the water bar
      fill: '뀁뀃' # Segment representing fill water level
      empty: '뀁뀄' # Segment representing empty water level
      right: '뀁뀅' # Right cap of the water bar
    # Hex color codes in the format &#RRGGBB are supported
    # in both the display name and lore.
    display_name: "&6Dirty Water Canteen\n&r<usage-bar>"
    lore:
      - "&r<usage-bar>" # Display the usage bar in the lore
      - "&fWhen consumed, it will cause illness."
      - "&e&oPlease heat it before drinking."

  'clean_water_canteen':
    material: WOODEN_SWORD
    drinking-model:
      material: POTION
      custom-model-data: 1023
    hide-attribute: true
    show-durability: true # Show durability bar when the item have been used/consume
    # Use custom-model-data to apply a custom texture to this item.
    # Remove this line if you do not need custom model data.
    custom-model-data: 1023
    events:
      right_click:
        type: on_water
        replace: dirty_water_canteen
      consume:
        type: on_player
        max-usage: 5
        restore: 30 #restore thirst per consume
        water-type: CLEAN_WATER
        replace: canteen
    # Hex color codes in the format &#RRGGBB are supported
    # in both the display name and lore.
    display_name: "&6Clean Water Canteen\n&r<usage-bar>"
    usage-bar:
      font: "customcrops:default" # get from resource pack custom font
      left: '뀂'   # Left cap of the water bar
      fill: '뀁뀃' # Segment representing fill water level
      empty: '뀁뀄' # Segment representing empty water level
      right: '뀁뀅' # Right cap of the water bar
    lore:
      - "&r<usage-bar>" # Display the usage bar in the lore
      - "&fClean water."
