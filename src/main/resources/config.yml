# ============================================================
#                    ThirstBar Configuration
# ============================================================

# ---- Database ----
# Enable MySQL/MariaDB storage. If false, uses local flatfile.
Sql:
  Enable: false
  Host: 'localhost'
  Port: '3306'
  Username: 'root'
  Password: ''
  Database: 'ThirstBar'

# ---- Prevent Overdrinking ----
# If true, prevents players from drinking water when their thirst bar is full.
StopDrinking: true

# ---- Custom ActionBar (Icon-based display) ----
CustomActionBar:
  Enable: false
  Space: 3
  # Display direction: LEFT_TO_RIGHT or RIGHT_TO_LEFT
  Orientation: LEFT_TO_RIGHT
  ItemsAdder:
    Enable: false
    AutoDeploy:
      # Path: The destination folder relative to the ItemsAdder plugin directory
      Path: "contents/thirstbar"
      # SourceFolder: The folder name inside the plugin's jar that contains the resource files
      SourceFolder: "ItemsAdder"
    # Icon names registered in ItemsAdder for each thirst state
    Normal_Thirst: "normal_thirst"
    Normal_ThirstHalfLeft: "normal_thirst_half_left"
    Normal_ThirstHalfRight: "normal_thirst_half_right"
    Normal_ThirstEmpty: "normal_thirst_empty"
    Debuff_Thirst: "debuff_thirst"
    Debuff_ThirstHalfLeft: "debuff_thirst_half_left"
    Debuff_ThirstHalfRight: "debuff_thirst_half_right"
    Debuff_ThirstEmpty: "debuff_thirst_empty"
    RawWater_Thirst: "raw_water_thirst"
    RawWater_ThirstHalfLeft: "raw_water_thirst_half_left"
    RawWater_ThirstHalfRight: "raw_water_thirst_half_right"
    RawWater_ThirstEmpty: "raw_water_thirst_empty"

# ---- Furnace: Purify Raw Water ----
# Only works on Minecraft 1.16 and above
CustomFurnace:
  Exp: 10.0
  CookingTime: 10

# ---- Core Thirst Settings ----
Thirsty:
  Max: 100              # Maximum thirst value (points)
  Reduce: 1             # Thirst points lost per tick cycle
  Time: 100             # Ticks between each reduce cycle (20 ticks = 1 second)
  Damage: 1.5           # Damage dealt when thirst reaches 0 (in half-hearts, 1.5 = 0.75 heart)

# Cooldown (in seconds) before player can use /refresh again
CooldownRefresh: 5

# ---- Disabled Contexts ----
# Players in these gamemodes will not lose thirst
DisabledGamemode:
  - "CREATIVE"
  - "SPECTATOR"

# Players in these worlds will not lose thirst
DisabledWorlds:
  - "world_nether"

# ---- Drinking Raw Water (right-click water source block) ----
DrinkingRawWater:
  Enable: true
  Delay: 10             # Ticks to hold right-click before drinking
  Value: 5              # Thirst points restored per drink
  # How much FASTER thirst drains while debuffed (percentage).
  # Example: 50 = thirst drain speed increases by 50%
  Reduce: 50
  Duration: 100         # Ticks the raw water debuff lasts
  TitleActionBar: "&a<value>&f/&b<max> &f- <reduce>/<time>s &f-&c RAW WATER"
  TitleBossBar: "&a<value>&f/&b<max> &f- <reduce>/<time>s &f-&c RAW WATER"
  # Options: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
  Color: BLUE
  # Options: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  Style: SEGMENTED_10
  # Potion effects applied while debuffed. Format: EFFECT_NAME:AMPLIFIER
  Effects:
    - "SLOW:1"
  # Actions executed when player drinks raw water.
  # Supported: [message], [sound], [title], [subtitle], [player], [console]
  Actions:
    - "[message] &cYou are drinking raw water!"
    - "[sound] ENTITY_GENERIC_DRINK"
    # You can uncomment if you want.
    # - "[title] &cBe careful"
    # - "[subtitle] &cYou are drinking raw water!"
    # - "[player] help"
    # - "[console] msg <player> You are drinking raw water!."

# ---- Drinking Rain Water (look up during rain without a roof) ----
DrinkingRain:
  Enable: true
  Delay: 10             # Ticks to hold position before drinking
  Value: 5              # Thirst points restored per drink
  # How much FASTER thirst drains while debuffed (percentage).
  # Example: 50 = thirst drain speed increases by 50%
  Reduce: 50
  Duration: 100         # Ticks the rain water debuff lasts
  TitleActionBar: "&a<value>&f/&b<max> &f- <reduce>/<time>s &f-&c RAIN WATER"
  TitleBossBar: "&a<value>&f/&b<max> &f- <reduce>/<time>s &f-&c RAIN WATER"
  Color: BLUE
  Style: SEGMENTED_10
  Effects:
    - "SLOW:1"
  Actions:
    - "[message] &cYou are drinking rain water!"
    - "[sound] ENTITY_GENERIC_DRINK"
    # You can uncomment if you want.
    # - "[title] &cBe careful"
    # - "[subtitle] &cYou are drinking rain water!"
    # - "[sound] BLOCK_ANVIL_BREAK"
    # - "[player] help"
    # - "[console] msg <player> You are drinking rain water!."

# ---- Replace Hunger ----
# If true, the player's vanilla hunger bar becomes the thirst bar.
ReplaceHunger: false

# ---- Display: BossBar ----
BossBar:
  Enable: true
  # Placeholders: <value>, <max>, <reduce>, <time>
  Title: "&a<value>&f/&b<max> &f- <reduce>/<time>s"
  DisableTitle: "&a<value>&f/&b<max> &f- <reduce>/<time>s - &4DISABLE"
  # Options: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
  Color: BLUE
  # Options: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  Style: SEGMENTED_10

# ---- Display: ActionBar ----
ActionBar:
  Enable: true
  # Placeholders: <value>, <max>, <reduce>, <time>
  Title: "&a<value>&f/&b<max> &f- <reduce>/<time>s"
  DisableTitle: "&a<value>&f/&b<max> &f- <reduce>/<time>s - &4DISABLE"

# ---- Raw Potion Appearance ----
# Customizes the look of the raw/dirty water potion bottle item.
RawPotion:
  Name: "&cA dirty potion bottle"
  Lore:
    - "&f- When consumed, it will cause illness."
    - "&e&oPlease heat it before drinking."
  # Color only works on Minecraft 1.16 and above (RGB values 0-255)
  Color:
    Red: 120
    Green: 130
    Blue: 100